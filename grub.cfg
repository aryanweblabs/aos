set timeout=0
set default=0
terminal_input console
terminal_output console
insmod all_video

# The kernel requests a 32-bpp 1920x1080 framebuffer in its Multiboot2 header (src/boot/entry.S).
# If the firmware has no such mode GRUB falls back to its "auto" mode, and the kernel accepts 24/32-bpp RGB.
menuentry "AOS" {
    multiboot2 /boot/kernel.elf
    module2 /boot/initramfs.tar initramfs
    boot
}
